name: 'Generate Changelog'
description: 'Generates hierarchical changelog from PRs and tags'
inputs:
  release_type:
    description: 'Release type (major, minor, patch)'
    required: true
  next_version:
    description: 'Next version string (e.g., v1.2.3)'
    required: true
  repository:
    description: 'Repository in owner/repo format'
    required: true
  changelog_input_file:
    description: 'Path to JSON input file'
    required: true
  output_file:
    description: 'Path to output changelog file'
    required: false
    default: '/tmp/changelog.md'
outputs:
  changelog_file:
    description: 'Path to generated changelog file'
    value: ${{ inputs.output_file }}
runs:
  using: 'composite'
  steps:
    - name: Generate changelog
      id: generate
      shell: bash
      # P1-#A6-24: src/release/cli/* was moved to packages/release-cli/.
      env:
        RELEASE_CLI_VERSION: '1.7.0'
        NEXT_VERSION: ${{ inputs.next_version }}
        INPUT_FILE: ${{ inputs.changelog_input_file }}
        OUTPUT_FILE: ${{ inputs.output_file }}
      run: |
        set -euo pipefail
        # Generate header
        cat > "$OUTPUT_FILE" << EOF
        ## Release $NEXT_VERSION

        EOF

        # Generate body using the published @octopus-synapse/release-cli package.
        cat "$INPUT_FILE" \
          | bunx --package "@octopus-synapse/release-cli@$RELEASE_CLI_VERSION" octopus-release-gen-changelog \
          >> "$OUTPUT_FILE"

        echo "✅ Changelog generated at $OUTPUT_FILE"
