name: 'Calculate Version'
description: 'Calculates next version based on release type'
inputs:
  current_version:
    description: 'Current semver version (e.g., 1.2.3 or v1.2.3)'
    required: true
  release_type:
    description: 'Release type (major, minor, patch)'
    required: true
  with_prefix:
    description: 'Output with v prefix'
    required: false
    default: 'false'
outputs:
  next_version:
    description: 'Calculated next version'
    value: ${{ steps.calc.outputs.next_version }}
runs:
  using: 'composite'
  steps:
    - name: Calculate next version
      id: calc
      shell: bash
      # P1-#A6-24: src/release/cli/* was moved to packages/release-cli/.
      # Use the published @octopus-synapse/release-cli package, matching the
      # invocation pattern in _release-create-pr.yml. Bump in lockstep with
      # packages/release-cli/package.json.
      env:
        RELEASE_CLI_VERSION: '1.7.0'
        CURRENT_VERSION: ${{ inputs.current_version }}
        RELEASE_TYPE: ${{ inputs.release_type }}
        WITH_PREFIX: ${{ inputs.with_prefix }}
      run: |
        set -euo pipefail
        PREFIX_FLAG=""
        if [ "$WITH_PREFIX" = "true" ]; then
          PREFIX_FLAG="--with-prefix"
        fi

        NEXT=$(bunx --package "@octopus-synapse/release-cli@$RELEASE_CLI_VERSION" octopus-release-calc-version \
          "$CURRENT_VERSION" "$RELEASE_TYPE" $PREFIX_FLAG)

        echo "next_version=$NEXT" >> "$GITHUB_OUTPUT"
        echo "📦 Version: $CURRENT_VERSION → $NEXT ($RELEASE_TYPE)"
