name: 'Verify Pre-Commit Attestation'
description: |
  Verifies that .attestation.tree_hash matches the current commit's tree
  (with .attestation stripped). Runs inside a pre-built Docker image
  (ghcr.io/octopus-synapse/verify-attestation:v1) so there's no Node / npm
  setup overhead and no cross-repo package auth needed. Typical runtime:
  ~1.5–2.5s including image pull.
inputs:
  strict:
    description: 'Fail when no attestation file exists (default: true).'
    required: false
    default: 'true'
  max-age-hours:
    description: 'Warn if the attestation is older than N hours (default: 72).'
    required: false
    default: '72'
runs:
  using: 'docker'
  image: 'docker://ghcr.io/octopus-synapse/verify-attestation:v1'
  env:
    STRICT: ${{ inputs.strict }}
    MAX_AGE_HOURS: ${{ inputs.max-age-hours }}
