name: 'Verify Pre-Commit Attestation'
description: |
  Reads the .attestation file generated by @octopus-synapse/precommit at
  commit time and verifies the tree_hash matches the current commit. Fails
  the CI run if the file was modified after pre-commit checks.
inputs:
  strict:
    description: 'Fail when no attestation file exists (default: true).'
    required: false
    default: 'true'
  max-age-hours:
    description: 'Warn if the attestation is older than N hours (default: 72).'
    required: false
    default: '72'
runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.11'

    - name: Install @octopus-synapse/precommit globally
      shell: bash
      run: bun add --global @octopus-synapse/precommit
      env:
        BUN_CONFIG_REGISTRY: https://npm.pkg.github.com
        BUN_AUTH_TOKEN: ${{ github.token }}

    - name: Verify attestation
      shell: bash
      run: |
        if [ ! -f .attestation ]; then
          if [ "${{ inputs.strict }}" = "true" ]; then
            echo "::error::No .attestation file. Commit may have bypassed pre-commit hooks."
            exit 1
          fi
          echo "::warning::No .attestation file; continuing because strict=false."
          exit 0
        fi
        octopus-attest verify
