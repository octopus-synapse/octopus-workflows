name: 'Verify Pre-Commit Attestation'
description: |
  Reads the .attestation file generated by @octopus-synapse/precommit at
  commit time and verifies the tree_hash matches the current commit. Fails
  the CI run if the file was modified after pre-commit checks.
inputs:
  strict:
    description: 'Fail when no attestation file exists (default: true).'
    required: false
    default: 'true'
  max-age-hours:
    description: 'Warn if the attestation is older than N hours (default: 72).'
    required: false
    default: '72'
runs:
  using: 'composite'
  steps:
    - name: Setup Bun
      uses: oven-sh/setup-bun@v2
      with:
        bun-version: '1.3.11'

    - name: Configure GitHub Packages auth
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # bun only honors scoped registries via bunfig.toml in the current
        # working dir or $HOME. Write both so global and local installs see it.
        cat > "$HOME/.bunfig.toml" <<EOF
        [install.scopes]
        "@octopus-synapse" = { token = "${GH_TOKEN}", url = "https://npm.pkg.github.com/" }
        EOF
        # Also drop ~/.npmrc for any tooling (e.g. npm fallback) that reads it.
        {
          echo "@octopus-synapse:registry=https://npm.pkg.github.com"
          echo "//npm.pkg.github.com/:_authToken=${GH_TOKEN}"
        } > "$HOME/.npmrc"

    - name: Install @octopus-synapse/precommit globally
      shell: bash
      run: bun add --global @octopus-synapse/precommit

    - name: Verify attestation
      shell: bash
      run: |
        if [ ! -f .attestation ]; then
          if [ "${{ inputs.strict }}" = "true" ]; then
            echo "::error::No .attestation file. Commit may have bypassed pre-commit hooks."
            exit 1
          fi
          echo "::warning::No .attestation file; continuing because strict=false."
          exit 0
        fi
        octopus-attest verify
