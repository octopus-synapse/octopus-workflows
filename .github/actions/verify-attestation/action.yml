name: 'Verify Pre-Commit Attestation'
description: |
  Verifies that .attestation.tree_hash matches the current commit's tree
  (with .attestation stripped). Pure bash composite action using the git
  and jq binaries pre-installed on GitHub-hosted runners — no Docker, no
  Node/npm, no package auth. Typical runtime: ~2s.
inputs:
  strict:
    description: 'Fail when no attestation file exists (default: true).'
    required: false
    default: 'true'
  max-age-hours:
    description: 'Warn if the attestation is older than N hours (default: 72).'
    required: false
    default: '72'
runs:
  using: 'composite'
  steps:
    - name: Verify attestation
      shell: bash
      env:
        STRICT: ${{ inputs.strict }}
        MAX_AGE_HOURS: ${{ inputs.max-age-hours }}
        # On pull_request events, GitHub checks out a synthesized merge
        # commit (PR base + head). The merge tree differs from the head
        # tree, so HEAD^{tree} would never match an attestation generated
        # against the head SHA. Use the head SHA explicitly so verification
        # works on PR runs without forcing every contributor to rebase.
        PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        EVENT_NAME: ${{ github.event_name }}
      run: |
        set -euo pipefail

        if [ ! -f .attestation ]; then
          if [ "$STRICT" = "true" ]; then
            echo "::error::No .attestation file. Commit may have bypassed pre-commit hooks."
            exit 1
          fi
          echo "::warning::No .attestation file; continuing because strict=false."
          exit 0
        fi

        attested_hash=$(jq -r '.tree_hash' .attestation)
        if [ -z "$attested_hash" ] || [ "$attested_hash" = "null" ]; then
          echo "::error::Invalid attestation format — missing tree_hash field."
          exit 1
        fi

        # Pick the SHA whose tree the attestation actually claims to cover.
        # On pull_request events that's the PR head, not GitHub's merge
        # commit. On every other event HEAD is correct.
        target_sha="HEAD"
        if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$PR_HEAD_SHA" ]; then
          # Make sure the head ref is locally available — `actions/checkout`
          # in PR mode does fetch the head ref, but only the tip; this is
          # a no-op when the object is already cached.
          git fetch --no-tags --depth=1 origin "$PR_HEAD_SHA" 2>/dev/null || true
          target_sha="$PR_HEAD_SHA"
        fi

        # Reconstruct the tree of the target commit with the literal
        # `.attestation` entry stripped. Operates on git objects directly
        # so it works without the index populated.
        #
        # P2-#59: previously used `grep -vE '\.attestation$'`, which
        # collapsed any file whose name *ended* with `.attestation`
        # (e.g. `release.attestation`, `foo.attestation`). Compare the
        # filename column exactly via awk so only the top-level
        # `.attestation` entry is removed.
        commit_tree=$(git rev-parse "${target_sha}^{tree}")
        current_hash=$(git ls-tree "$commit_tree" | awk -F '\t' '$2 != ".attestation"' | git mktree)

        echo "event:    $EVENT_NAME"
        echo "target:   $target_sha"
        echo "attested: $attested_hash"
        echo "current:  $current_hash"

        if [ "$attested_hash" != "$current_hash" ]; then
          echo "::error::Tree hash mismatch — code was modified after pre-commit checks (or attestation was forged, or commit was amended)."
          exit 1
        fi

        # Age warning (non-fatal).
        timestamp=$(jq -r '.timestamp // empty' .attestation)
        if [ -n "$timestamp" ]; then
          attested_epoch=$(date -d "$timestamp" +%s 2>/dev/null || echo 0)
          now_epoch=$(date +%s)
          if [ "$attested_epoch" -gt 0 ]; then
            age_hours=$(( (now_epoch - attested_epoch) / 3600 ))
            if [ "$age_hours" -gt "$MAX_AGE_HOURS" ]; then
              echo "::warning::Attestation is ${age_hours}h old (threshold: ${MAX_AGE_HOURS}h)."
            fi
          fi
        fi

        echo "✓ attestation verified"
