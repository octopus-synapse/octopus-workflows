name: 'Verify Pre-Commit Attestation'
description: |
  Reads the .attestation file generated by @octopus-synapse/precommit at
  commit time and verifies the tree_hash matches the current commit. Fails
  the CI run if the file was modified after pre-commit checks.
inputs:
  strict:
    description: 'Fail when no attestation file exists (default: true).'
    required: false
    default: 'true'
  max-age-hours:
    description: 'Warn if the attestation is older than N hours (default: 72).'
    required: false
    default: '72'
  packages-token:
    description: |
      Token with read:packages scope on the octopus-synapse org (to install
      @octopus-synapse/precommit). Defaults to github.token, but the caller
      should pass secrets.OCTOPUS_PACKAGES_TOKEN (an org-level secret) for
      cross-repo access because the default GITHUB_TOKEN only reads packages
      published by the SAME repo.
    required: false
    default: ${{ github.token }}
runs:
  using: 'composite'
  steps:
    - name: Setup Node
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Write ~/.npmrc for @octopus-synapse
      shell: bash
      env:
        PACKAGES_TOKEN: ${{ inputs.packages-token }}
      run: |
        {
          echo "@octopus-synapse:registry=https://npm.pkg.github.com"
          echo "//npm.pkg.github.com/:_authToken=${PACKAGES_TOKEN}"
        } > "$HOME/.npmrc"
        chmod 600 "$HOME/.npmrc"

    - name: Install @octopus-synapse/precommit globally
      shell: bash
      run: npm install -g @octopus-synapse/precommit

    - name: Verify attestation
      shell: bash
      run: |
        if [ ! -f .attestation ]; then
          if [ "${{ inputs.strict }}" = "true" ]; then
            echo "::error::No .attestation file. Commit may have bypassed pre-commit hooks."
            exit 1
          fi
          echo "::warning::No .attestation file; continuing because strict=false."
          exit 0
        fi
        octopus-attest verify
