name: _static-analysis-template

on:
  workflow_call:
    inputs:
      test-command:
        description: "Command to run tests"
        required: true
        type: string
      test-name:
        description: "Test name for summary"
        required: true
        type: string
      timeout:
        description: "Timeout in minutes"
        required: false
        type: number
        default: 10

env:
  NODE_ENV: test

jobs:
  test:
    name: ${{ inputs.test-name }} Tests
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: octopus-synapse/octopus-workflows
          ref: v1
          path: _shared

      - name: Run tests
        id: tests
        uses: ./_shared/.github/actions/run-test-suite
        with:
          test-command: ${{ inputs.test-command }}
          test-name: ${{ inputs.test-name }}
          artifact-name: ${{ inputs.test-name }}-results
          needs-db: 'false'

      - name: Summary
        if: always()
        env:
          TEST_STATUS: ${{ steps.tests.outputs.status || 'failure' }}
          TEST_NAME: ${{ inputs.test-name }}
          TEST_PASS: ${{ steps.tests.outputs.pass || '0' }}
          TEST_FAIL: ${{ steps.tests.outputs.fail || '0' }}
          TEST_SKIP: ${{ steps.tests.outputs.skip || '0' }}
          TEST_DURATION: ${{ steps.tests.outputs.duration || '0' }}
        run: |
          _shared/.github/scripts/generate-summary.sh \
            "$TEST_STATUS" \
            "$TEST_NAME" \
            "$TEST_PASS" \
            "$TEST_FAIL" \
            "$TEST_SKIP" \
            "$TEST_DURATION" \
            test-output.txt
