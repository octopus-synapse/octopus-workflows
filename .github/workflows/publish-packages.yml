name: publish-packages

# Publishes all @octopus-synapse/* npm packages in packages/* to GitHub Packages
# whenever a v* tag is pushed. Publish is idempotent: a package whose version
# is already on the registry is silently skipped, so bumping only a single
# package's version doesn't require touching the others. Moves the `v1`
# moving tag on successful publish so consumer
# `uses: octopus-synapse/octopus-workflows/...@v1` resolves to the latest
# compatible release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build precommit package
        working-directory: packages/precommit
        run: bun run build

      - name: Build release-cli package
        working-directory: packages/release-cli
        run: bun run build

      - name: Configure npm auth for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
          echo "@octopus-synapse:registry=https://npm.pkg.github.com" >> ~/.npmrc
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Publish each package independently. A 409 Conflict (version already
      # on the registry) is expected when only some packages have been bumped
      # — we swallow it and continue instead of failing the whole workflow.
      # Anything else still fails loudly.
      - name: Publish all packages (idempotent)
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          publish_pkg() {
            local dir="$1"
            local name="$2"
            echo "::group::Publishing $name"
            local log
            if ! log=$(npm publish --registry https://npm.pkg.github.com 2>&1); then
              if echo "$log" | grep -qE "E409|Cannot publish over existing version|already exists"; then
                echo "[$name] already on registry at this version — skipping."
              else
                echo "$log"
                echo "::error::Publish failed for $name"
                return 1
              fi
            else
              echo "$log"
              echo "[$name] published."
            fi
            echo "::endgroup::"
          }

          (cd packages/biome-config && publish_pkg . "@octopus-synapse/biome-config")
          (cd packages/commitlint-config && publish_pkg . "@octopus-synapse/commitlint-config")
          (cd packages/precommit && publish_pkg . "@octopus-synapse/precommit")
          (cd packages/release-cli && publish_pkg . "@octopus-synapse/release-cli")

      - name: Move major version tag (v1)
        if: startsWith(github.ref_name, 'v1.')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f v1
          git push -f origin v1
