name: publish-packages

# Publishes all @octopus-synapse/* npm packages in packages/* to GitHub Packages
# whenever a v* tag is pushed. Moves the `v1` moving tag to the commit on
# successful publish so consumer `uses: octopus-synapse/octopus-workflows/...@v1`
# resolves to the latest compatible release.

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.11

      - name: Install deps
        run: bun install --frozen-lockfile

      - name: Build precommit package
        working-directory: packages/precommit
        run: bun run build

      - name: Configure npm auth for GitHub Packages
        run: |
          echo "//npm.pkg.github.com/:_authToken=${GITHUB_TOKEN}" >> ~/.npmrc
          echo "@octopus-synapse:registry=https://npm.pkg.github.com" >> ~/.npmrc
        env:
          GITHUB_TOKEN: ${{ github.token }}

      - name: Publish @octopus-synapse/biome-config
        working-directory: packages/biome-config
        run: npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Publish @octopus-synapse/commitlint-config
        working-directory: packages/commitlint-config
        run: npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Publish @octopus-synapse/precommit
        working-directory: packages/precommit
        run: npm publish --registry https://npm.pkg.github.com
        env:
          NODE_AUTH_TOKEN: ${{ github.token }}

      - name: Move major version tag (v1)
        if: startsWith(github.ref_name, 'v1.')
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -f v1
          git push -f origin v1
