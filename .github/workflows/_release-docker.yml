name: _release-docker

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag (e.g., v1.0.0)'
        required: true
        type: string

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # contents:write — `gh release edit` (line 51) needs it
    # packages:write — `docker push` to GHCR uses it
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # PR builds: scope GHA cache by branch so concurrent PRs don't poison
      # each other's cache. Don't push to the shared registry layer — that's
      # reserved for tagged releases (cache contamination = mis-tagged image
      # contents on the next release).
      - name: Build and push (PR cache mode)
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          # Consumer Dockerfiles authenticate to GitHub Packages (private
          # @octopus-synapse devDeps) via `--mount=type=secret,id=GITHUB_TOKEN`.
          # Without this the mount is empty inside the build and `bun install`
          # 401s on every scoped package — exactly what bit profile-services
          # release v0.2.2.
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          # Read from both sources for max hit rate; warm starts from the
          # registry layer that the latest release pushed, fall back to GHA
          # cache for branch-local iterations.
          cache-from: |
            type=gha,scope=pr-${{ github.ref_name }}
            type=registry,ref=ghcr.io/${{ github.repository }}:cache
          cache-to: |
            type=gha,mode=max,scope=pr-${{ github.ref_name }}

      # Release builds: write to the shared registry layer so cold builds
      # (and other repos that pull this cache) benefit. Also keep a default-
      # scope GHA cache so back-to-back releases on the same runner reuse.
      - name: Build and push (release cache mode)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          secrets: |
            GITHUB_TOKEN=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ inputs.tag }}
            ghcr.io/${{ github.repository }}:latest
          cache-from: |
            type=gha
            type=registry,ref=ghcr.io/${{ github.repository }}:cache
          cache-to: |
            type=gha,mode=max
            type=registry,ref=ghcr.io/${{ github.repository }}:cache,mode=max

      - name: Update release notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          IMAGE: ghcr.io/${{ github.repository }}
        run: |
          NOTES="$(gh release view "$TAG" --json body -q '.body')"
          printf '%s\n\n---\n\n## Docker\n\n```bash\ndocker pull %s:%s\n```\n' \
            "$NOTES" "$IMAGE" "$TAG" > /tmp/notes.md
          gh release edit "$TAG" --notes-file /tmp/notes.md
