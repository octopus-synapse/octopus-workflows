name: _release-finalize

on:
  workflow_call:
    inputs:
      commit_sha:
        description: 'Commit SHA to create release for'
        required: true
        type: string
    outputs:
      released:
        description: 'Whether a fresh release was created (false on re-run over an existing tag)'
        value: ${{ jobs.finalize.outputs.released }}
      version:
        description: 'Release version (without v prefix)'
        value: ${{ jobs.finalize.outputs.version }}
      tag:
        description: 'Release tag (with v prefix)'
        value: ${{ jobs.finalize.outputs.tag }}

jobs:
  finalize:
    runs-on: ubuntu-latest
    # contents:write — push tag + create release
    permissions:
      contents: write
    outputs:
      released: ${{ steps.release.outputs.released }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0
          ref: ${{ inputs.commit_sha }}

      - uses: octopus-synapse/octopus-workflows/.github/actions/setup-git-bot@v1

      - name: Extract version
        id: version
        run: |
          VERSION="v$(jq -r '.version' package.json)"
          echo "version=${VERSION#v}" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Create tag
        id: tag
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            git tag -a "$TAG" -m "Release $TAG"
            # Without an explicit failure here the next step would create a
            # GitHub release pointing at a tag that doesn't actually exist
            # remotely — and `released=true` would propagate to docker build
            # and any downstream deploy. Surface the push failure loudly.
            if ! git push origin "$TAG"; then
              echo "::error::Failed to push tag $TAG to origin (check token permissions / branch protection)."
              exit 1
            fi
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Get release notes
        id: notes
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          REPO_OWNER: ${{ github.repository_owner }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          PR_BODY=$(gh api graphql -f query='
            query($sha: String!, $owner: String!, $repo: String!) {
              repository(owner: $owner, name: $repo) {
                commit: object(expression: $sha) {
                  ... on Commit {
                    associatedPullRequests(first: 1) {
                      nodes { body }
                    }
                  }
                }
              }
            }
          ' -f sha="$COMMIT_SHA" \
            -f owner="$REPO_OWNER" \
            -f repo="$REPO_NAME" \
            --jq '.data.repository.commit.associatedPullRequests.nodes[0].body // ""' 2>/dev/null || echo "")

          echo "$PR_BODY" | sed -e '/^> :warning:/d' -e '/^> ⚠️/d' | sed '/^---$/,/^---$/d' > /tmp/release-notes.md

      - name: Create release
        id: release
        if: steps.tag.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          gh release create "$TAG" \
            --title "Release $TAG" \
            --notes-file /tmp/release-notes.md \
            --target main
          echo "released=true" >> $GITHUB_OUTPUT

  # After finalize tags main, main carries a `chore(release): vX.Y.Z` commit
  # that bumps package.json + .release-please-manifest.json. Without this
  # job, homolog never sees those bumps — so the NEXT release PR
  # (homolog -> main) opens with conflicts on exactly those files + the
  # regenerated .attestation, every single release. This job opens a
  # maintenance PR that re-aligns homolog with main immediately after
  # the tag is pushed, so the loop stays flat.
  sync-main-to-homolog:
    needs: finalize
    if: needs.finalize.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout main (the branch that just got the release bump)
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: main
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: octopus-synapse/octopus-workflows/.github/actions/setup-git-bot@v1

      - name: Open sync PR back to homolog
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.finalize.outputs.tag }}
        run: |
          set -euo pipefail
          BRANCH="chore/sync-main-${TAG}"

          # Branch off main carrying the chore(release) commit. Hard-reset
          # would diverge homolog; a PR is the only safe path because of
          # branch protection on homolog.
          git checkout -B "$BRANCH"
          git push -u origin "$BRANCH" --force

          # If a PR for this tag already exists (re-run safety), skip
          # creation — the previous attempt is still open and mergeable.
          EXISTING=$(gh pr list --head "$BRANCH" --base homolog --json number --jq '.[0].number' || echo "")
          if [ -n "$EXISTING" ]; then
            echo "Sync PR already exists as #$EXISTING — leaving it for the team to merge."
            exit 0
          fi

          gh pr create \
            --base homolog \
            --head "$BRANCH" \
            --title "chore(release): sync main back to homolog after ${TAG}" \
            --body "Automated after release ${TAG}. Carries the chore(release) commit from main back to homolog so release-please's manifest stays accurate and the next release PR doesn't open with trivial conflicts on package.json / .release-please-manifest.json." \
            --label patch
