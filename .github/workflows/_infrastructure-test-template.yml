name: _infrastructure-test-template

on:
  workflow_call:
    inputs:
      test-command:
        description: "Command to run tests"
        required: true
        type: string
      test-name:
        description: "Test name for summary"
        required: true
        type: string
      db-name:
        description: "Database name"
        required: false
        type: string
        default: "test_db"
      timeout:
        description: "Timeout in minutes"
        required: false
        type: number
        default: 15
      extra-env-vars:
        description: |
          Extra `KEY=value` pairs (one per line) merged into the env
          of the test step. Use for things like `BCRYPT_COST=4`,
          `SHARDS=2`, `LOG_LEVEL=error`. Variables defined here win
          over the template defaults.
        required: false
        type: string
        default: ""
      db-init-sql:
        description: |
          SQL run against the postgres service before the test step.
          Useful for test-only knobs that accept `pg_reload_conf()`
          (e.g. `ALTER SYSTEM SET synchronous_commit = off`).
          Settings that need a postgres restart (`fsync`, `wal_level`)
          can't be flipped via this hook because GitHub Actions
          services don't accept a custom `command:` — those need a
          custom image.
        required: false
        type: string
        default: ""

env:
  DATABASE_URL: postgresql://postgres:postgres@localhost:5433/${{ inputs.db-name }}
  REDIS_HOST: localhost
  REDIS_PORT: 6380
  NODE_ENV: test
  JWT_SECRET: test-secret-key-for-ci-tests-minimum-32-chars
  RATE_LIMIT_ENABLED: true

jobs:
  test:
    name: ${{ inputs.test-name }} Tests
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout }}

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ${{ inputs.db-name }}
        ports:
          - 5433:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: octopus-synapse/octopus-workflows
          ref: v1
          path: _shared

      - name: Apply test-only postgres tunings
        if: inputs.db-init-sql != ''
        env:
          PGPASSWORD: postgres
          DB: ${{ inputs.db-name }}
          DB_INIT_SQL: ${{ inputs.db-init-sql }}
        run: |
          for i in {1..30}; do
            if pg_isready -h localhost -p 5433 -U postgres -d "$DB" >/dev/null 2>&1; then
              break
            fi
            sleep 1
          done
          printf '%s\n' "$DB_INIT_SQL" > /tmp/db-init.sql
          psql -h localhost -p 5433 -U postgres -d "$DB" \
               -v ON_ERROR_STOP=on -f /tmp/db-init.sql

      - name: Export extra env vars
        if: inputs.extra-env-vars != ''
        env:
          EXTRA_ENV_VARS: ${{ inputs.extra-env-vars }}
        run: |
          while IFS= read -r line; do
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue
            if [[ ! "$line" =~ ^[A-Z_][A-Z0-9_]*=.*$ ]]; then
              echo "::error::Rejected extra-env-vars line (must match ^[A-Z_][A-Z0-9_]*=.*$): $line"
              exit 1
            fi
            printf '%s\n' "$line" >> "$GITHUB_ENV"
          done <<< "$EXTRA_ENV_VARS"

      - name: Run tests
        id: tests
        uses: ./_shared/.github/actions/run-test-suite
        with:
          test-command: ${{ inputs.test-command }}
          test-name: ${{ inputs.test-name }}
          artifact-name: ${{ inputs.test-name }}-results
          needs-db: 'true'

      - name: Summary
        if: always()
        env:
          TEST_STATUS: ${{ steps.tests.outputs.status || 'failure' }}
          TEST_NAME: ${{ inputs.test-name }}
          TEST_PASS: ${{ steps.tests.outputs.pass || '0' }}
          TEST_FAIL: ${{ steps.tests.outputs.fail || '0' }}
          TEST_SKIP: ${{ steps.tests.outputs.skip || '0' }}
          TEST_DURATION: ${{ steps.tests.outputs.duration || '0' }}
        run: |
          _shared/.github/scripts/generate-summary.sh \
            "$TEST_STATUS" \
            "$TEST_NAME Tests" \
            "$TEST_PASS" \
            "$TEST_FAIL" \
            "$TEST_SKIP" \
            "$TEST_DURATION" \
            test-output.txt
