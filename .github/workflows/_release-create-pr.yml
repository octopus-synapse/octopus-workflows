name: _release-create-pr

on:
  workflow_call:
    inputs:
      sha:
        description: 'Commit SHA'
        required: true
        type: string
      forced_type:
        description: 'Forced release type (empty to detect from labels)'
        required: false
        type: string
        default: ''
      repository:
        description: 'Repository in owner/repo format'
        required: true
        type: string
      repository_owner:
        description: 'Repository owner'
        required: true
        type: string
      repository_name:
        description: 'Repository name'
        required: true
        type: string
    outputs:
      release_type:
        description: 'Detected release type'
        value: ${{ jobs.create-pr.outputs.release_type }}
      next_version:
        description: 'Next version'
        value: ${{ jobs.create-pr.outputs.next_version }}

jobs:
  create-pr:
    runs-on: ubuntu-latest
    outputs:
      release_type: ${{ steps.detect.outputs.release_type }}
      next_version: ${{ steps.version.outputs.next }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - uses: octopus-synapse/octopus-workflows/.github/actions/setup-bun-env@v1
        with:
          github-token: ${{ github.token }}

      - uses: octopus-synapse/octopus-workflows/.github/actions/setup-git-bot@v1

      - name: Get PR labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          FORCED="${{ inputs.forced_type }}"
          [ -n "$FORCED" ] && { echo "labels=$FORCED" >> "$GITHUB_OUTPUT"; exit 0; }

          # Use the shared @octopus-synapse/release-cli package — consumer
          # repos no longer need to vendor src/release/* themselves. setup-bun-env
          # already configured the GH Packages scope, so `bunx` resolves it.
          LABELS=$(bunx --package @octopus-synapse/release-cli octopus-release-get-pr-labels \
            --sha="${{ inputs.sha }}" \
            --owner="${{ inputs.repository_owner }}" \
            --repo="${{ inputs.repository_name }}" 2>/dev/null || echo "")
          echo "labels=$LABELS" >> "$GITHUB_OUTPUT"

      - name: Detect release type
        id: detect
        run: |
          set -euo pipefail
          TYPE=$(bunx --package @octopus-synapse/release-cli octopus-release-detect \
            --labels="${{ steps.labels.outputs.labels }}")
          echo "release_type=$TYPE" >> "$GITHUB_OUTPUT"

      - name: Calculate version
        id: version
        if: steps.detect.outputs.release_type != ''
        run: |
          set -euo pipefail
          if ! git fetch origin main; then
            echo "::error::Could not fetch origin/main — does the branch exist on the remote?"
            exit 1
          fi
          CURRENT=$(git show origin/main:package.json | jq -r '.version')
          NEXT=$(bunx --package @octopus-synapse/release-cli octopus-release-calc-version \
            "$CURRENT" "${{ steps.detect.outputs.release_type }}")
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Generate changelog
        if: steps.detect.outputs.release_type != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          bunx --package @octopus-synapse/release-cli octopus-release-gather-data \
            --release-type="${{ steps.detect.outputs.release_type }}" \
            --next-version="v${{ steps.version.outputs.next }}" \
            --repository="${{ inputs.repository }}" \
            | bunx --package @octopus-synapse/release-cli octopus-release-gen-changelog \
            > /tmp/changelog.md

          echo -e "\n---\n\n> ⚠️ **Merging this PR will create release v${{ steps.version.outputs.next }}**" >> /tmp/changelog.md

      - name: Create PR
        if: steps.detect.outputs.release_type != ''
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.next }}
        run: |
          set -euo pipefail

          # Idempotency: bump package.json + .release-please-manifest.json
          # in-place, but only commit if the working tree actually changed.
          # Without this guard a re-run of the workflow (same trigger fires
          # twice, manual dispatch after auto, etc.) creates an empty
          # chore(release) commit on top of the previous one, leaving
          # homolog with a sequence of orphaned bumps.
          jq ".version = \"$VERSION\"" package.json > tmp && mv tmp package.json
          if [ -f .release-please-manifest.json ]; then
            jq ".\".\" = \"$VERSION\"" .release-please-manifest.json > tmp && mv tmp .release-please-manifest.json
            git add .release-please-manifest.json
          fi
          git add package.json

          if git diff --cached --quiet; then
            echo "Version files already at v$VERSION — skipping commit."
          else
            git commit -m "chore(release): v$VERSION"
            if ! git push origin homolog; then
              echo "::error::Failed to push chore(release) commit to homolog."
              exit 1
            fi
          fi

          EXISTING=$(gh pr list --head homolog --base main --json number --jq '.[0].number' || echo "")
          BODY=$(cat /tmp/changelog.md)

          if [ -n "$EXISTING" ]; then
            gh pr edit "$EXISTING" --title "chore(release): v$VERSION" --body "$BODY"
          else
            gh pr create --head homolog --base main --title "chore(release): v$VERSION" --body "$BODY"
          fi
